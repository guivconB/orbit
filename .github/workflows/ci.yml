name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Os testes não abrem o Electron; não precisa baixar o binário.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # config.ts é privado (.gitignore). O exemplo basta para compilar e testar.
      - name: Preparar config do Firebase
        run: cp src/firebase/config.example.ts src/firebase/config.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
